name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: FrontPruebas

      - uses: actions/checkout@v4
        with:
          repository: pgprimitz/PiposLibrary
          path: PiposLibrary

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci && npm run build
        working-directory: PiposLibrary

      - run: npm ci && npm run build
        working-directory: FrontPruebas

      - run: cp dist/front-pruebas/browser/index.html dist/front-pruebas/browser/404.html
        working-directory: FrontPruebas

      - uses: actions/upload-pages-artifact@v3
        with:
          path: FrontPruebas/dist/front-pruebas/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
