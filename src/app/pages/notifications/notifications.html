<div class="page">
  @if (unreadVisible()) {
    <div class="heading">
      <generic-button variant="ghost" size="sm" (click)="markAllRead()">
        Marcar todas como leídas
      </generic-button>
    </div>
  }

  <generic-tabs [tabs]="filterTabs" [activeId]="filter()" (tabChange)="onTab($event)" />

  <div class="list">
    @for (row of visible(); track row.id) {
      <article class="item" [class.unread]="!row.read">
        <generic-icon [name]="iconFor(row)" [size]="22" />
        <div class="copy">
          <div class="top">
            <generic-title [level]="3" [tone]="toneFor(row)">{{ row.title | sentenceCase }}</generic-title>
            <generic-badge [tone]="toneFor(row)" appearance="outline" size="sm">
              {{ typeLabel(row) | sentenceCase }}
            </generic-badge>
          </div>
          <generic-text size="sm">{{ row.description | sentenceCase }}</generic-text>
          <div class="meta">
            <generic-text [muted]="true" size="sm">{{ row.when }}</generic-text>
            @if (row.xp) {
              <span class="reward">+{{ row.xp }}</span>
            }
            @if (row.coins) {
              <span class="reward coins">+{{ row.coins }}</span>
            }
          </div>
        </div>
        <button
          type="button"
          class="mark"
          [class.done]="row.read"
          [attr.aria-label]="row.read ? 'Leída' : 'Marcar como leída'"
          (click)="markRead(row.id)"
        >
          <generic-icon name="check" [size]="18" />
        </button>
      </article>
    } @empty {
      <generic-empty-state
        title="No hay avisos en este filtro"
        description="Cuando llegue un logro, desafío o mensaje, aparece acá."
      />
    }
  </div>
</div>
