<div class="grid">
  @for (course of courses; track course.id) {
    <generic-card class="course-card" [tone]="course.tone" padding="none">
      <div class="head" [class]="course.tone">
        <div class="head-top">
          <span class="cohort">{{ course.cohort }}</span>
          <span class="vitals">
            <generic-progress
              [value]="course.lives"
              [max]="5"
              [hearts]="true"
              size="sm"
              tone="red"
            />
            <generic-coin-counter [count]="course.coins" size="sm" />
          </span>
        </div>
        <generic-title [level]="2" [tone]="course.tone">{{ course.code }}</generic-title>
        <generic-text size="sm">{{ course.title | sentenceCase }}</generic-text>
      </div>
      <div class="body">
        <div class="meta">
          <generic-badge [tone]="course.tone" appearance="outline" size="sm">
            {{ course.status }}
          </generic-badge>
          <generic-course-meta-badges
            [difficulty]="course.difficulty"
            [durationLabel]="course.durationLabel"
            size="sm"
          />
          <generic-badge tone="neutral" appearance="outline" size="sm">{{ course.language }}</generic-badge>
        </div>
        <generic-progress
          [value]="course.progress"
          [max]="100"
          label="Progreso del curso"
          [showValue]="true"
          [tone]="course.tone"
        />
        <div class="actions">
          <generic-button [variant]="course.tone" (click)="open(course)">Ver Curso</generic-button>
        </div>
      </div>
    </generic-card>
  }
</div>

<generic-course-modal
  [(open)]="modalOpen"
  [tone]="selected()?.courseTone ?? 'celeste'"
  [kicker]="selected()?.cohort ?? ''"
  [title]="selected()?.code ?? ''"
  [subtitle]="selected()?.title ?? ''"
  [lives]="selected()?.lives ?? 0"
  [maxLives]="5"
  [coins]="selected()?.coins ?? 0"
  [badges]="selectedBadges()"
  [progressValue]="selected()?.progress ?? 0"
  actionLabel="Entrar al curso"
  (actionClick)="enterSpeedrun()"
/>
